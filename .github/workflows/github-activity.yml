name: Update GitHub Activity

on:
  workflow_dispatch:

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:

  update-activity:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_github_activity.py

      - name: Commit updated SVG files
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add repository-activity.svg
          git add activity-by-day.svg

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "chore: update GitHub activity"

            git push

          fi